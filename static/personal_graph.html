<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>个人社交星图</title>
  <style>
    body { margin: 0; background-color: #050510; font-family: sans-serif; overflow: hidden;}
    .node-tooltip { background: rgba(15,23,42,0.9); border: 1px solid #334155; border-radius: 6px; padding: 12px; color: white;}
    .node-tooltip .name { font-weight: bold; border-bottom: 1px solid #334155; padding-bottom: 5px; margin-bottom: 5px;}
    .badge { padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-left: 6px; vertical-align: middle; }
    #legend {
      position: absolute; bottom: 30px; left: 30px; background: rgba(30,41,59,0.85); backdrop-filter: blur(10px);
      border-radius: 10px; padding: 15px; color: white; border: 1px solid #475569; font-size: 14px; z-index: 10;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); line-height: 1.8;
    }
    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #00ffcc; font-size: 20px; font-weight: bold; z-index: 20;
    }
  </style>
  <script src="https://unpkg.com/3d-force-graph"></script>
</head>
<body>
  <div id="loading">🚀 正在呼叫 GNN 算法计算推荐...</div>
  <div id="legend">
    <div style="font-weight: bold; color: #38bdf8; margin-bottom: 8px; border-bottom: 1px solid #475569; padding-bottom: 5px;">图谱说明</div>
    <div>🟡 <span style="color:#fbbf24; font-weight:bold;">中心节点 (当前用户)</span></div>
    <div>🔵 <span style="color:#3b82f6;">真实连边 (现有好友)</span></div>
    <div>✨ <span style="color:#00ffcc; font-weight:bold;">预测连边 (算法推荐好友)</span></div>
    <div style="font-size: 12px; color: #94a3b8; margin-top: 5px;">* 悬停可查看是关注还是粉丝</div>
  </div>
  <div id="3d-graph"></div>

  <script type="module">
    import * as THREE from 'https://esm.sh/three';
    import { UnrealBloomPass } from 'https://esm.sh/three/examples/jsm/postprocessing/UnrealBloomPass.js';

    const urlParams = new URLSearchParams(window.location.search);
    const centerUid = String(urlParams.get('uid'));
    const recIdsStr = urlParams.get('recs') ? urlParams.get('recs').split(',').map(String) :[];

    if (!centerUid || centerUid === 'null') {
      document.getElementById('loading').innerText = "❌ 缺少 uid 参数！";
    } else {
      document.getElementById('loading').innerText = "🌌 正在渲染专属星空...";
      fetch('/static/graph.json?t=' + Math.random())
        .then(res => res.json())
        .then(graphData => {
          document.getElementById('loading').style.display = 'none';

          let adjacencyList = {};
          const followingSet = new Set(); // 我关注了谁
          const followerSet = new Set();  // 谁关注了我

          graphData.nodes.forEach(n => adjacencyList[String(n.id)] = new Set());
          
          graphData.links.forEach(l => {
            const s = String(l.source.id || l.source);
            const t = String(l.target.id || l.target);
            
            // 构建无向邻接表（用于筛出1度好友）
            if (adjacencyList[s] && adjacencyList[t]) {
              adjacencyList[s].add(t); adjacencyList[t].add(s);
            }
            // 构建有向关系（用于判断关注/粉丝）
            if (s === centerUid) followingSet.add(t);
            if (t === centerUid) followerSet.add(s);
          });

          const existingFriends = Array.from(adjacencyList[centerUid] || []);
          const keepIds = new Set([centerUid, ...existingFriends, ...recIdsStr]);
          
          const filteredNodes = graphData.nodes.filter(n => keepIds.has(String(n.id)));
          const filteredLinks = graphData.links.filter(l => keepIds.has(String(l.source)) && keepIds.has(String(l.target)));

          recIdsStr.forEach(rid => {
            filteredLinks.push({ source: centerUid, target: rid, isVirtual: true });
          });

          const Graph = ForceGraph3D()(document.getElementById('3d-graph'))
            .backgroundColor('#02020a')
            .nodeRelSize(4)
            .nodeOpacity(0.9)
            .nodeResolution(8)
            .nodeColor(node => {
              const nid = String(node.id);
              if (nid === centerUid) return '#fbbf24'; // 你自己
              if (recIdsStr.includes(nid)) return '#00ffcc'; // AI推荐
              const isFollowing = followingSet.has(nid);
              const isFollower = followerSet.has(nid);
              if (isFollowing && isFollower) return '#ec4899'; // 互相关注
              if (isFollowing) return '#3b82f6'; // 你的关注
              if (isFollower) return '#10b981'; // 你的粉丝
              return '#4488dd'; // 其他
            })
            .nodeVal(node => {
              const nid = String(node.id);
              if (nid === centerUid) return 12; // 缩小中心节点
              if (recIdsStr.includes(nid)) return 8; // 缩小推荐节点
              return 4; // 缩小其他默认节点
            })
            .linkColor(link => link.isVirtual ? 'rgba(0, 255, 204, 0.5)' : 'rgba(68, 136, 221, 0.15)') // 调整颜色对比，保留推荐边绿色特征
            .linkWidth(link => link.isVirtual ? 1.5 : 0.2)
            .linkDirectionalParticles(link => link.isVirtual ? 4 : 0) // 仅保留关键路径的粒子，减少画面混乱
            .linkDirectionalParticleSpeed(0.008)
            .linkDirectionalParticleWidth(1.2)
            .linkDirectionalParticleColor(link => link.isVirtual ? '#00ffcc' : '#ffffff') // 让推荐边粒子也呈现专属发光绿
            .nodeLabel(node => {
              const nid = String(node.id);
              let relationTag = "";
              
              // 核心修改：精细化标签判断
              if (nid === centerUid) {
                  relationTag = "<span class='badge' style='color:#fbbf24; border:1px solid #fbbf24;'>👉 你自己</span>";
              } else if (recIdsStr.includes(nid)) {
                  relationTag = "<span class='badge' style='color:#00ffcc; border:1px solid #00ffcc;'>✨ AI推荐</span>";
              } else {
                  const isFollowing = followingSet.has(nid);
                  const isFollower = followerSet.has(nid);
                  if (isFollowing && isFollower) {
                      relationTag = "<span class='badge' style='color:#ec4899; border:1px solid #ec4899;'>🤝 互相关注</span>";
                  } else if (isFollowing) {
                      relationTag = "<span class='badge' style='color:#3b82f6; border:1px solid #3b82f6;'>👀 你的关注</span>";
                  } else if (isFollower) {
                      relationTag = "<span class='badge' style='color:#10b981; border:1px solid #10b981;'>🌟 你的粉丝</span>";
                  }
              }

              return `
              <div class="node-tooltip">
                <div class="name">👤 ${node.name} 【${node.community||'未知'}】 ${relationTag}</div>
                <div class="info">${(node.info||'').replace(/,/g, '<br/>')}</div>
              </div>`;
            })
            .graphData({ nodes: filteredNodes, links: filteredLinks });

          // 核心效果1：Bloom 发光效果（动态平衡亮度与层次）
          const bloomPass = new UnrealBloomPass();
          bloomPass.threshold = 0.3;  // 提高阈值：避免过亮导致颜色泛白不分
          bloomPass.strength = 1.0;   // 调弱光晕强度：保留颜色本貌，区分蓝绿
          bloomPass.radius = 0.2;     // 缩小发散半径：防止颜色串光
          Graph.postProcessingComposer().addPass(bloomPass);

          // 核心效果2：静态背景星空（大量离散小粒子作为背景）
          const starGeometry = new THREE.BufferGeometry();
          const starCount = 3000;
          const starPositions = new Float32Array(starCount * 3);
          for (let i = 0; i < starCount * 3; i++) {
            starPositions[i] = (Math.random() - 0.5) * 1000;
          }
          starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
          const starMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.8,
            transparent: true,
            opacity: 0.8
          });
          const stars = new THREE.Points(starGeometry, starMaterial);
          Graph.scene().add(stars);

          // 核心效果3：缓慢自动旋转效果，仿佛星空流转
          let angle = 0;
          function autoRotate() {
            angle += 0.001;
            Graph.cameraPosition({
              x: Math.sin(angle) * 180,
              z: Math.cos(angle) * 180,
              y: 20
            }, { x: 0, y: 0, z: 0 }); // 去掉 100ms 过渡时间，因为每帧都在更新，过渡会导致画面振动抖动
            requestAnimationFrame(autoRotate);
          }
          autoRotate();

          setTimeout(() => Graph.cameraPosition({ z: 200 }, null, 1500), 500);
          window.addEventListener('resize', () => {
            Graph.width(window.innerWidth);
            Graph.height(window.innerHeight);
          });
        });
    }
  </script>
</body>
</html>
