<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <style>
    body { margin: 0; background-color: #0f172a; font-family: sans-serif; overflow: hidden;}
    .node-tooltip { background: rgba(15,23,42,0.9); border: 1px solid #334155; border-radius: 6px; padding: 12px; color: white; font-size: 13px;}
    .node-tooltip .name { font-weight: bold; border-bottom: 1px solid #334155; padding-bottom: 5px; margin-bottom: 5px;}
    #control-panel {
      position: absolute; top: 20px; left: 20px; background: rgba(30,41,59,0.8); backdrop-filter: blur(10px);
      border-radius: 12px; padding: 15px; color: white; border: 1px solid #475569; z-index: 10; width: 220px;
    }
    select { width: 100%; padding: 8px; border-radius: 6px; background: #0f172a; color: white; border: 1px solid #475569; margin-bottom: 12px;}
    .switch-container { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #bae6fd; font-weight: bold;}
    .toggle-checkbox { width: 16px; height: 16px; cursor: pointer; accent-color: #38bdf8;}
  </style>
  <script src="https://unpkg.com/3d-force-graph"></script>
</head>
<body>
  <div id="control-panel">
    <h3 style="margin-top:0; color:#38bdf8; font-size: 16px;">🌌 校园圈层全景</h3>
    <label class="text-xs text-stone-400 mb-1 block">1. 圈层透视过滤</label>
    <select id="community-select" onchange="filterByCommunity()">
      <option value="ALL">🌐 显示全校完整图谱</option>
      <option value="运动健将圈">🏀 运动健将圈</option>
      <option value="文艺星人圈">🎨 文艺星人圈</option>
      <option value="硬核极客圈">💻 硬核极客圈</option>
      <option value="二次元宅圈">🎮 二次元宅圈</option>
      <option value="社牛风云圈">🔥 社牛风云圈</option>
      <option value="佛系养生圈">🍵 佛系养生圈</option>
      <option value="爆肝修仙圈">🦉 爆肝修仙圈</option>
    </select>
    <div class="switch-container border-t border-slate-600 pt-3">
      <label for="avatarToggle" class="cursor-pointer">✨ 显示用户头像</label>
      <input type="checkbox" id="avatarToggle" onchange="toggleAvatars()" class="toggle-checkbox">
    </div>
  </div>
  
  <div id="3d-graph"></div>

  <script type="module">
    import * as THREE from 'https://esm.sh/three';
    import { UnrealBloomPass } from 'https://esm.sh/three/examples/jsm/postprocessing/UnrealBloomPass.js';

    let fullData = { nodes: [], links:[] };
    let isAvatarMode = false; 
    let isFullGraph = true; // 🚀 新增：用来判断当前是否是全校图
    const cacheBuster = Math.random();

    const commColors = {
      "运动健将圈": "#f59e0b", "文艺星人圈": "#ec4899", "硬核极客圈": "#3b82f6", 
      "二次元宅圈": "#8b5cf6", "社牛风云圈": "#ef4444", "佛系养生圈": "#10b981", 
      "爆肝修仙圈": "#14b8a6", "综合跨界圈": "#94a3b8" 
    };

    const Graph = ForceGraph3D()(document.getElementById('3d-graph'))
      .jsonUrl('/static/graph.json?t=' + cacheBuster)
      .backgroundColor('#000005') 
      .nodeRelSize(4)
      .nodeVal(node => Math.sqrt(node.val || 1) * 0.8)
      .nodeColor(node => commColors[node.community] || '#94a3b8')
      .nodeOpacity(1.0)
      .nodeResolution(16) 
      .nodeThreeObject(node => {
        if (!isAvatarMode) return null; 

        const size = 12; 
        const canvasSize = 256; 
        const canvas = document.createElement('canvas');
        canvas.width = canvasSize; canvas.height = canvasSize;
        const ctx = canvas.getContext('2d');
        const ringColor = commColors[node.community] || '#ffffff';

        ctx.clearRect(0, 0, canvasSize, canvasSize);

        const center = canvasSize / 2;
        const lineWidth = 12;
        const radius = center - lineWidth; 

        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        const material = new THREE.SpriteMaterial({ map: texture, transparent: true, depthWrite: false });
        const sprite = new THREE.Sprite(material);
        sprite.scale.set(size, size, 1);

        const drawNeonRing = () => {
            ctx.beginPath();
            ctx.arc(center, center, radius, 0, 2 * Math.PI);
            ctx.lineWidth = lineWidth;
            ctx.strokeStyle = ringColor;
            ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(center, center, radius, 0, 2 * Math.PI);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            texture.needsUpdate = true;
        };

        if (node.avatar) {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = `/static/avatars/${node.avatar}?t=${cacheBuster}`;
            img.onload = () => {
                ctx.save();
                ctx.beginPath();
                ctx.arc(center, center, radius, 0, 2 * Math.PI);
                ctx.clip(); 
                ctx.drawImage(img, lineWidth, lineWidth, canvasSize - 2*lineWidth, canvasSize - 2*lineWidth);
                ctx.restore();
                drawNeonRing();
            };
        } else {
            ctx.save();
            ctx.beginPath();
            ctx.arc(center, center, radius, 0, 2 * Math.PI);
            ctx.clip();
            ctx.fillStyle = '#1e293b';
            ctx.fill();
            ctx.font = 'bold 120px sans-serif';
            ctx.fillStyle = '#cbd5e1'; 
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText((node.username || 'U').charAt(0).toUpperCase(), center, center + 10);
            ctx.restore();
            drawNeonRing();
        }
        return sprite;
      })
      .nodeLabel(node => `<div class="node-tooltip"><div class="name">👤 ${node.username||'User'} 【${node.community||'未知'}】</div>${(node.info||'').replace(/,/g, '<br/>')}</div>`)
      
      // 🚀 核心逻辑 1：动态切换连线的粗细和颜色！
      // 全校图：极细极淡 (rgba(255,255,255, 0.05), width 0.1)
      // 特定圈层：粗亮线 (rgba(140, 180, 255, 0.4), width 0.8)
      .linkColor(() => isFullGraph ? 'rgba(255, 255, 255, 0.05)' : 'rgba(140, 180, 255, 0.4)') 
      .linkWidth(() => isFullGraph ? 0.1 : 0.8)
      
      .linkDirectionalParticles(0) 
      .onEngineStop(() => Graph.zoomToFit(400));

    const bloomPass = new UnrealBloomPass();
    bloomPass.threshold = 0.65; 
    bloomPass.strength = 1.0;  
    bloomPass.radius = 0.15;    
    Graph.postProcessingComposer().addPass(bloomPass);

    const starGeometry = new THREE.BufferGeometry();
    const starPositions = new Float32Array(3000 * 3);
    for (let i = 0; i < 9000; i++) { starPositions[i] = (Math.random() - 0.5) * 1000; }
    starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8, transparent: true, opacity: 0.6 });
    Graph.scene().add(new THREE.Points(starGeometry, starMaterial));

    fetch(`/static/graph.json?t=${cacheBuster}`)
      .then(res => res.json())
      .then(data => fullData = data);

    window.filterByCommunity = function() { 
      const comm = document.getElementById('community-select').value;
      
      // 🚀 核心逻辑 2：状态判定与样式强制重绘
      isFullGraph = (comm === "ALL");
      Graph.linkColor(Graph.linkColor()).linkWidth(Graph.linkWidth()); // 强行触发连线样式更新

      if (isFullGraph) { 
          Graph.nodeVisibility(() => true).linkVisibility(() => true);
      } else {
          Graph.nodeVisibility(node => node.community === comm)
               .linkVisibility(link => {
                   const sComm = (typeof link.source === 'object') ? link.source.community : '';
                   const tComm = (typeof link.target === 'object') ? link.target.community : '';
                   return sComm === comm && tComm === comm;
               });
      }
    };

    window.toggleAvatars = function() {
        isAvatarMode = document.getElementById('avatarToggle').checked;
        Graph.nodeThreeObject(Graph.nodeThreeObject());
    };

    window.addEventListener('resize', () => { Graph.width(window.innerWidth); Graph.height(window.innerHeight); });
  </script>
</body>
</html>
