{% extends "base.html" %}
{% block content %}
    <!-- 弹窗组件 -->
    <div id="graphModal" class="fixed inset-0 z-[100] hidden bg-black/90 backdrop-blur-sm">
        <button onclick="closeGraphModal()" class="absolute top-4 right-6 text-white bg-white/10 hover:bg-red-500 rounded-full p-2 z-[101] transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
        <iframe id="graphIframe" src="" class="w-full h-full border-none"></iframe>
    </div>
<!-- 个人主页模态框 (User Profile Modal) -->
<div id="userProfileModal" class="fixed inset-0 z-[110] hidden flex items-center justify-center bg-stone-900/80 backdrop-blur-md transition-opacity">
    <!-- 卡片容器：超大圆角，极简留白 -->
    <div class="bg-white rounded-[2rem] w-full max-w-lg max-h-[90vh] overflow-y-auto shadow-2xl relative custom-scroll transform transition-all">
        
        <!-- 悬浮关闭按钮 (磨砂玻璃质感) -->
        <button onclick="closeUserModal()" class="absolute top-5 right-5 w-8 h-8 flex items-center justify-center bg-black/20 hover:bg-black/40 backdrop-blur text-white rounded-full transition z-20 font-bold">
            ✕
        </button>

        <!-- 艺术感 Banner (深邃质感，代替原来刺眼的渐变) -->
        <div class="h-36 w-full bg-gradient-to-br from-stone-800 via-stone-700 to-stone-900 relative overflow-hidden">
            <!-- 装饰性光晕，增加科技感 -->
            <div class="absolute top-0 right-0 w-32 h-32 bg-amber-500/20 rounded-full blur-3xl transform translate-x-1/2 -translate-y-1/2"></div>
            <div class="absolute bottom-0 left-0 w-24 h-24 bg-blue-500/20 rounded-full blur-2xl transform -translate-x-1/2 translate-y-1/2"></div>
        </div>

        <!-- 主体内容区 -->
        <div class="px-8 pb-8 relative">
            
            <!-- 头像与操作栏 (巧妙重叠，破框而出) -->
            <div class="flex justify-between items-end -mt-12 mb-4">
                <!-- 头像 -->
                <div class="w-24 h-24 rounded-full bg-gradient-to-br from-stone-50 to-stone-100 border-4 border-white flex items-center justify-center text-stone-700 font-serif font-bold text-4xl shadow-lg relative z-10" id="modalAvatar">
                    ?
                </div>
                <!-- 关注按钮容器 -->
                <div id="modalFollowBtnContainer" class="pb-2"></div>
            </div>

            <!-- 用户名与 ID -->
            <div class="mb-6">
                <h3 class="text-3xl font-serif font-bold text-stone-800 tracking-tight" id="modalUsername">Name</h3>
                <p class="text-stone-400 font-mono text-sm mt-1">Campus ID: #<span id="modalUid"></span></p>
            </div>

            <!-- 优雅的分割线 -->
            <div class="h-px w-full bg-stone-100 mb-6"></div>

            <!-- 档案信息：基础属性 -->
            <div class="mb-6">
                <h4 class="text-[10px] font-bold text-stone-400 uppercase tracking-widest mb-3">基础信息 Basic Info</h4>
                <div id="modalBasicInfo" class="flex flex-wrap gap-2">
                    <!-- JS 自动注入蓝/灰底标签 -->
                </div>
            </div>

            <!-- 档案信息：个性与爱好 -->
            <div class="mb-8">
                <h4 class="text-[10px] font-bold text-stone-400 uppercase tracking-widest mb-3">生活与爱好 Lifestyle & Hobbies</h4>
                <div id="modalHobbiesInfo" class="flex flex-wrap gap-2">
                    <!-- JS 自动注入黄/橙底标签 -->
                </div>
            </div>

            <!-- 社交雷达诊断卡片 (数据看板风格) -->
            <div class="bg-stone-50 rounded-2xl p-5 border border-stone-100/80">
                <h4 class="text-xs font-bold text-stone-800 mb-4 flex items-center gap-2">
                    <span class="text-lg">📡</span> AI 社交洞察
                </h4>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-stone-100/50 flex flex-col justify-center">
                        <div class="text-stone-400 text-[10px] uppercase font-bold mb-1">全网连通度</div>
                        <div class="flex items-baseline gap-1">
                            <span id="modalConnCount" class="font-bold text-stone-800 text-2xl leading-none">0</span>
                            <span class="text-xs text-stone-500 font-medium">个朋友</span>
                        </div>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-stone-100/50 flex flex-col justify-center">
                        <div class="text-stone-400 text-[10px] uppercase font-bold mb-1">核心活跃圈层</div>
                        <div id="modalDominantComm" class="font-bold text-amber-600 text-sm mt-1 truncate">暂无</div>
                    </div>
                </div>
            </div>

            <!-- ── MessageSender 破冰留言组件 ── -->
            <div id="messageSenderWrap" class="mt-6 hidden">
                <!-- 状态 A：输入框 -->
                <div id="msgSenderInput" class="space-y-3">
                    <h4 class="text-[10px] font-bold text-stone-400 uppercase tracking-widest flex items-center gap-1.5">
                        <span>💌</span> 留言
                    </h4>
                    <div class="relative">
                        <textarea id="msgContent"
                            maxlength="500"
                            placeholder="说句破冰的话吧...最多500字"
                            rows="3"
                            class="w-full px-4 py-3 rounded-2xl text-sm text-stone-700 placeholder-stone-300 resize-none outline-none transition
                                   bg-white/60 backdrop-blur border border-stone-200 focus:border-amber-300 focus:ring-2 focus:ring-amber-100"
                        ></textarea>
                        <span id="msgCharCount" class="absolute bottom-2.5 right-3 text-[10px] text-stone-300">0/500</span>
                    </div>
                    <button id="msgSendBtn" onclick="MessageSender.send()"
                        class="w-full py-2.5 rounded-xl text-sm font-semibold transition
                               bg-stone-900 hover:bg-stone-700 text-white shadow-sm active:scale-[.98]">
                        发送留言
                    </button>
                    <p class="text-[10px] text-stone-300 text-center">注：你只能给对方发送一次留言</p>
                </div>
                <!-- 状态 B：已发送 -->
                <div id="msgSenderDone" class="hidden flex items-center justify-center gap-2 py-3 px-4 rounded-xl bg-stone-50 border border-stone-100">
                    <span class="text-base">✉️</span>
                    <span class="text-sm text-stone-400 font-medium">已发送留言</span>
                </div>
            </div>
            <!-- ── MessageSender 结束 ── -->

        </div>
    </div>
</div>

    <!-- 引入各个页面模块 -->
    {% include "landing.html" %}
    {% include "auth.html" %}
    {% include "dashboard.html" %}
{% endblock %}
