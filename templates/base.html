<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>推荐交友 · 校园社交</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        /* 隐藏原生 details 标签的箭头 */
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        details[open] .arrow-icon { transform: rotate(180deg); }
    </style>
</head>
<body>
    {% block content %}{% endblock %}

    <!-- 1. 核心与工具层 -->
    <script src="/static/js/core.js"></script>
    <script src="/static/js/modals.js"></script>
    <script src="/static/js/sidebar.js"></script>
    
    <!-- 2. 独立业务模块 -->
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/agent.js"></script>
    
    <!-- 3. 面板视图层 -->
    <script src="/static/js/panels/recommend.js"></script>
    <script src="/static/js/panels/relations.js"></script>
    <script src="/static/js/panels/profile.js"></script>
    <script src="/static/js/panels/search.js"></script>
    <script src="/static/js/panels/stats.js"></script>
    <script src="/static/js/panels/activity.js"></script>

    <!-- 4. 私聊 -->
    <script src="/static/js/message.js"></script>
</body>
</html>
