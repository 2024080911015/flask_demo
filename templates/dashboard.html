<!-- PAGE 3: 模块化后台控制台 -->
<div id="page-dashboard" class="page bg-stone-50" style="overflow-y: hidden;">
    <div class="flex h-screen w-full">
        
        <!-- ================= 左侧导航栏 (完整版) ================= -->
        <aside class="w-64 bg-white border-r border-stone-200 flex flex-col shrink-0 shadow-sm z-20">
            <!-- Logo 区 -->
            <div class="h-16 flex items-center px-6 border-b border-stone-100">
                <span class="font-serif text-amber-700 text-xl font-bold">校园社交<span id="adminBadge" class="hidden ml-2 text-[10px] bg-red-100 text-red-600 px-2 py-1 rounded-full font-sans">管理员</span></span>
            </div>

            <!-- 用户简要信息 -->
            <div class="p-6 flex items-center gap-3 border-b border-stone-100">
                <div class="w-10 h-10 rounded-full bg-amber-100 flex items-center justify-center text-amber-700 font-bold text-lg" id="avatarInitial">?</div>
                <div>
                    <p class="text-sm font-semibold text-stone-800" id="dashUsername">—</p>
                    <p class="text-xs text-stone-400">ID: <span id="dashUid" class="font-mono text-amber-600">—</span></p>
                </div>
            </div>

            <!-- 导航菜单 -->
            <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
                <button onclick="switchMenu('recommend')" id="menu-recommend" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-stone-600 hover:bg-amber-50 hover:text-amber-700 menu-active bg-amber-50 text-amber-700">
                    <span>✨</span> 推荐交友
                </button>
                <button onclick="switchMenu('relations')" id="menu-relations" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-stone-600 hover:bg-stone-100">
                    <span>🤝</span> 关系管理
                </button>
                <button onclick="switchMenu('search')" id="menu-search" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-stone-600 hover:bg-stone-100">
                    <span>🔍</span> 找朋友
                </button>
                <button onclick="switchMenu('profile')" id="menu-profile" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-stone-600 hover:bg-stone-100">
                    <span>👤</span> 个人空间
                </button>
                <div class="my-4 border-t border-stone-100"></div> <!-- 分割线 -->
                <button onclick="switchMenu('stats')" id="menu-stats" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition text-stone-600 hover:bg-stone-100">
                    <span>📊</span> 全校生态大盘
                </button>
            </nav>

            <div class="p-4 border-t border-stone-100">
                <button onclick="doLogout()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-sm font-medium text-stone-500 hover:bg-red-50 hover:text-red-600 transition">
                    退出登录
                </button>
            </div>
        </aside>

        <!-- ================= 右侧主内容区 (Main Content) ================= -->
        <main class="flex-1 h-screen overflow-y-auto relative bg-[#faf9f7]">
            
            <!-- 管理员超级控制台 (吸顶) -->
            <div id="adminPanel" class="hidden m-6 p-4 bg-blue-50 border border-blue-100 rounded-xl flex items-center justify-between shadow-sm">
                <div>
                    <h3 class="text-blue-800 font-bold text-sm">🛠️ Manager 控制台</h3>
                    <p class="text-blue-600/70 text-xs">执行“T+1 离线重训”以吸收新数据。</p>
                </div>
                <button id="btn-admin-retrain" onclick="doAdminRetrain()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-bold shadow transition">
                    🚀 重训 GNN
                </button>
            </div>

            <!-- 使用 Jinja2 优雅地引入你的子面板！ -->
            {% include "panels/recommend.html" %}
            {% include "panels/relations.html" %}
            {% include "panels/profile.html" %}
            {% include "panels/search.html" %}
            {% include "panels/stats.html" %}

        </main>
    </div>
</div>
