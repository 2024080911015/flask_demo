<div id="panel-recommend" class="panel-content block p-6 max-w-[96%] xl:max-w-[1600px] mx-auto space-y-6">
    <!-- 顶部：个人名片 Banner (横向铺满，显得大气) -->
    <div class="rounded-2xl p-8 shadow-sm flex flex-col md:flex-row items-center justify-between gap-6" style="background:linear-gradient(135deg,#2d2416,#5c3d1e)">
        <div class="flex items-center gap-5">
            <div class="w-20 h-20 rounded-full bg-white/10 flex items-center justify-center text-white/70 text-4xl font-bold border-2 border-amber-500/30" id="displayAvatarInitial">?</div>
            <div>
                <p class="text-white/40 text-sm mb-1">当前分析账号</p>
                <h2 class="font-serif text-3xl font-bold text-white"><span id="displayUsername"></span> <span class="text-white/50 text-lg font-sans">#<span id="displayUserId"></span></span></h2>
                <div id="displayUserInfo" class="flex flex-wrap gap-2 mt-3"></div>
            </div>
        </div>
        <button onclick="openPersonalGraph()" class="bg-amber-500 hover:bg-amber-600 text-stone-900 font-bold px-6 py-3 rounded-xl transition shadow-lg flex items-center gap-2">
            ✨ 查看专属 AI 星图
        </button>
    </div>
    
    <div class="grid grid-cols-1 xl:grid-cols-4 gap-6">
        <!-- 左侧：配置与雷达报告 -->
        <aside class="xl:col-span-1 space-y-6">
            <div class="card-warm p-5 rounded-2xl shadow-sm">
                <h3 class="text-sm font-semibold text-stone-700 mb-4">⚙️ 推荐引擎配置</h3>
                <div class="space-y-4 text-sm">
                    <div class="grid grid-cols-2 gap-1 bg-stone-50 p-1 rounded-xl border border-stone-100">
                        <button id="mode-social" onclick="setMode('social')" class="px-2 py-2 rounded-lg text-xs font-medium transition tab-active bg-white shadow-sm">社交优化</button>
                        <button id="mode-gnn" onclick="setMode('gnn')" class="px-2 py-2 rounded-lg text-xs font-medium transition text-stone-500">纯相似度</button>
                    </div>
                    <select id="communitySelect" class="w-full px-3 py-2 border border-stone-200 rounded-xl bg-white text-xs text-stone-600 outline-none"><option value="">不限社区</option></select>
                    <button onclick="applyFilters()" class="w-full bg-amber-50 hover:bg-amber-100 text-amber-800 px-4 py-2.5 rounded-xl text-xs font-bold transition">应用配置并重新计算</button>
                </div>
            </div>
            <div id="diagnosticPanel" class="card-warm p-5 rounded-2xl shadow-sm hidden">
                <h3 class="text-sm font-semibold text-stone-700 mb-4">📡 社交雷达诊断</h3>
                <div class="flex items-center gap-3 mb-2 p-3 bg-amber-50 rounded-xl"><div id="diagTitle" class="font-serif font-bold text-xl text-amber-700"></div></div>
                <p id="diagDesc" class="text-xs text-stone-500 mb-4"></p>
                <div class="mb-3 h-48 flex items-center justify-center relative"><canvas id="communityChart"></canvas></div>
                <div class="p-3 bg-blue-50 text-blue-900 rounded-xl text-xs leading-relaxed"><span class="font-semibold">💡 建议：</span><span id="diagAdvice"></span></div>
            </div>
        </aside>

<!-- 右侧：AI 推荐卡片瀑布流 -->
<section class="xl:col-span-3">
    <div class="card-warm rounded-2xl p-6 shadow-sm h-full flex flex-col">
        <h3 class="text-lg font-serif font-bold text-stone-800 mb-4 border-b border-stone-100 pb-3 shrink-0">✨ AI 为您精选的相似灵魂</h3>
        
        <!-- 核心修复：flex-1 让这个容器撑满剩余高度，gap-3 控制间距 -->
        <div id="recommendList" class="flex-1 flex flex-col gap-3">
            <p class="text-sm text-stone-400">正在加载推荐...</p>
        </div>
    </div>
</section>
    </div>
</div>
