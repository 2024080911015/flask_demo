<div id="panel-relations" class="panel-content hidden p-6 max-w-[96%] xl:max-w-[1600px] mx-auto space-y-6">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-serif font-bold text-stone-800">关系管理</h2>
        <!-- 改成直接输入名字新建分组 -->
        <div class="flex gap-2">
            <input type="text" id="newGroupName" placeholder="输入新分组名称..." class="px-4 py-2 bg-white border border-stone-200 rounded-xl text-sm focus:outline-none focus:border-amber-400 shadow-sm">
            <button onclick="createNewGroup()" class="bg-stone-800 border border-stone-800 text-white px-5 py-2 rounded-xl text-sm font-bold shadow-sm hover:bg-stone-900 transition flex items-center gap-2">
                + 新建分组
            </button>
        </div>
    </div>
    
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
        <!-- 我的关注 (折叠面板) -->
        <div class="card-warm rounded-2xl p-6 shadow-sm">
            <h3 class="text-lg font-semibold text-stone-800 mb-6 border-b border-stone-100 pb-3">我的关注 (<span id="countFollowing">0</span>)</h3>
            <div id="followingGroupsContainer" class="space-y-4 max-h-[700px] overflow-y-auto pr-2 custom-scroll"></div>
        </div>
        
        <!-- 我的粉丝 -->
        <div class="card-warm rounded-2xl p-6 shadow-sm">
            <h3 class="text-lg font-semibold text-stone-800 mb-6 border-b border-stone-100 pb-3">我的粉丝 (<span id="countFollowers">0</span>)</h3>
            <div id="followersList" class="space-y-3 max-h-[700px] overflow-y-auto pr-2 custom-scroll"></div>
        </div>
    </div>

<!-- 弹窗 2：批量分配成员 (企业级宽屏带搜索版) -->
    <div id="memberManagerModal" class="fixed inset-0 z-[105] hidden flex items-center justify-center bg-stone-900/70 backdrop-blur-sm transition-opacity p-4">
        <!-- 弹窗容器：加宽到 max-w-3xl，高度自适应且限制最大高度 -->
        <div class="bg-white rounded-3xl w-full max-w-3xl shadow-2xl flex flex-col max-h-[90vh] overflow-hidden">
            
            <!-- 头部区域 (固定不滚动) -->
            <div class="px-8 py-6 border-b border-stone-100 flex justify-between items-center shrink-0 bg-white">
                <div>
                    <h3 class="text-2xl font-serif font-bold text-stone-800">分配成员</h3>
                    <p class="text-sm text-stone-500 mt-1">当前正在为 <span id="mm-group-name" class="text-amber-600 font-bold bg-amber-50 px-2 py-0.5 rounded-md"></span> 添加好友</p>
                </div>
                <button onclick="closeMemberManager()" class="w-10 h-10 flex items-center justify-center bg-stone-100 hover:bg-red-100 text-stone-500 hover:text-red-500 rounded-full transition font-bold text-xl">&times;</button>
            </div>
            
            <input type="hidden" id="mm-group-id">
            
            <!-- 搜索与工具栏 (固定不滚动) -->
            <div class="px-8 py-4 bg-stone-50/80 border-b border-stone-100 shrink-0">
                <div class="relative">
                    <span class="absolute inset-y-0 left-4 flex items-center text-stone-400 text-lg">🔍</span>
                    <input type="text" id="mm-search-input" onkeyup="filterGroupMembers()" placeholder="搜索好友的用户名或 ID..." class="w-full pl-12 pr-4 py-3 bg-white border border-stone-200 rounded-xl text-sm focus:outline-none focus:border-amber-400 focus:ring-4 focus:ring-amber-50 transition shadow-sm font-medium">
                </div>
            </div>
            
            <!-- 列表展示区 (核心滚动区) -->
            <div class="p-8 overflow-y-auto custom-scroll flex-1 bg-stone-50/30">
                <!-- 核心改动：采用两列网格布局 (md:grid-cols-2)，空间利用率翻倍！ -->
                <div id="mm-friend-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- JS 生成带有头像的精美 Checkbox 卡片 -->
                </div>
            </div>
            
            <!-- 底部操作区 (固定不滚动) -->
            <div class="px-8 py-5 border-t border-stone-100 flex gap-4 justify-end shrink-0 bg-white">
                <button onclick="closeMemberManager()" class="px-6 py-3 text-stone-600 bg-stone-100 rounded-xl hover:bg-stone-200 font-bold transition text-sm">取消</button>
                <button id="btn-save-members" onclick="saveGroupMembers()" class="px-8 py-3 bg-stone-900 text-white font-bold rounded-xl hover:bg-amber-500 transition shadow-lg text-sm flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                    保存分组
                </button>
            </div>
            
        </div>
    </div>
</div>
