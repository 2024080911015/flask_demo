<!-- 面板 4: 找朋友 (列表搜索版) -->
<div id="panel-search" class="panel-content hidden p-6 max-w-5xl mx-auto space-y-6">
    <h2 class="text-2xl font-serif font-bold text-stone-800 mb-6">找朋友</h2>
    
    <!-- 搜索框大屏 -->
    <div class="card-warm rounded-3xl p-10 shadow-sm flex flex-col items-center justify-center min-h-[30vh]">
        <div class="text-6xl mb-6">🧭</div>
        <h3 class="text-xl font-bold text-stone-700 mb-2">探索校园社交图谱</h3>
        <p class="text-sm text-stone-400 mb-8 text-center">支持输入 <b class="text-amber-600">学号(ID)</b> 或 <b class="text-amber-600">用户名</b> 进行模糊检索</p>
        
        <!-- 搜索大框 (注意：input type 改成了 text，不再限制纯数字) -->
        <div class="w-full max-w-2xl bg-stone-50 border-2 border-stone-200 rounded-2xl p-2 shadow-inner flex flex-col md:flex-row items-center gap-2 focus-within:border-amber-400 focus-within:bg-white transition-all">
            <div class="flex items-center w-full md:w-auto flex-1">
                <div class="text-2xl ml-3 opacity-50 hidden md:block">🔍</div>
                <input type="text" id="globalSearchInput" placeholder="输入关键字..." class="flex-1 bg-transparent px-4 py-3 md:px-2 md:py-3 text-base md:text-lg outline-none text-stone-700 placeholder-stone-400 font-mono w-full">
            </div>
            <button onclick="searchOtherUser()" class="w-full md:w-auto bg-stone-900 text-white px-6 md:px-8 py-3 rounded-xl text-sm font-bold hover:bg-amber-500 transition shadow-md shrink-0">
                全校检索
            </button>
        </div>
    </div>

    <!-- 搜索结果列表区 (初始隐藏) -->
    <div id="searchResultListArea" class="hidden mt-8 animation-fade-in">
        <h3 class="text-lg font-bold text-stone-800 mb-4 border-b border-stone-100 pb-2">
            🎯 检索结果 <span id="searchResultCount" class="text-sm font-normal text-stone-400 ml-2"></span>
        </h3>
        
        <!-- 瀑布流网格，展示搜出来的一群人 -->
        <div id="searchResultGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <!-- JS 动态渲染卡片 -->
        </div>
    </div>
</div>
