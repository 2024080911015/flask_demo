<!-- START OF FILE panels/profile.html -->
<div id="panel-profile" class="panel-content hidden p-6 max-w-3xl mx-auto space-y-6">
    <h2 class="text-2xl font-serif font-bold text-stone-800 mb-6">个人空间</h2>
    
    <div class="card-warm rounded-3xl p-8 shadow-sm border border-stone-100">
        <!-- 顶部：头像区 (始终显示，不参与切换) -->
        <div class="flex flex-col items-center mb-8 pb-8 border-b border-stone-100">
            <div class="relative group cursor-pointer mb-4" onclick="document.getElementById('avatarInput').click()">
                <div class="w-28 h-28 rounded-full bg-gradient-to-br from-amber-100 to-orange-100 border-4 border-white flex items-center justify-center text-amber-700 font-bold text-5xl shadow-md transition-transform group-hover:scale-105 overflow-hidden" id="profileAvatar">?</div>
                <div class="absolute inset-0 bg-black/50 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                    <span class="text-white text-xs font-medium text-center">修改头像</span>
                </div>
            </div>
            <input type="file" id="avatarInput" accept="image/*" class="hidden" onchange="uploadAvatar()">
            
            <h3 class="text-2xl font-bold text-stone-800" id="prof-display-name">User</h3>
            
            <!-- 新增：状态与签名展示 -->
            <div id="display-stat-sign" class="mt-3 text-center">
                <span id="prof-display-status" class="px-3 py-1 bg-amber-100 text-amber-700 text-xs font-bold rounded-full border border-amber-200">找朋友</span>
                <p id="prof-display-signature" class="mt-4 text-stone-500 italic text-sm">“加载中...”</p>
            </div>
        </div>

        <!-- 1. 展示态：纯信息列举 -->
        <div id="profile-display-view" class="space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-stone-50 p-4 rounded-2xl">
                    <p class="text-[10px] font-bold text-stone-400 uppercase">基础资料</p>
                    <div id="prof-info-tags" class="flex flex-wrap gap-2 mt-2"></div>
                </div>
                <div class="bg-stone-50 p-4 rounded-2xl">
                    <p class="text-[10px] font-bold text-stone-400 uppercase">系统标识</p>
                    <p class="mt-2 text-sm font-mono text-amber-600">UID: #<span id="profileUid"></span></p>
                </div>
            </div>
            <button onclick="toggleProfileEdit(true)" class="w-full py-3 border-2 border-stone-100 text-stone-600 rounded-xl text-sm font-bold hover:bg-stone-50 transition">
                📝 修改个人资料
            </button>
        </div>

        <!-- 2. 编辑态：表单 (默认隐藏) -->
        <form id="profile-edit-view" class="hidden space-y-6" onsubmit="event.preventDefault(); saveProfile();">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-bold text-stone-500 mb-2 uppercase">用户名</label>
                    <input type="text" id="prof-username" class="w-full px-5 py-3 bg-stone-50 border border-stone-200 rounded-xl text-sm outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-xs font-bold text-stone-500 mb-2 uppercase">当前状态</label>
                    <select id="prof-status" class="w-full px-5 py-3 bg-stone-50 border border-stone-200 rounded-xl text-sm outline-none">
                        <option value="找朋友">🔍 找朋友</option>
                        <option value="开心">😊 开心</option>
                        <option value="恋爱中">❤️ 恋爱中</option>
                        <option value="爆肝中">🔥 爆肝中</option>
                        <option value="潜水">🌊 潜水</option>
                    </select>
                </div>
            </div>
            
            <div>
                <label class="block text-xs font-bold text-stone-500 mb-2 uppercase">个人签名 (最多 30 字)</label>
                <div class="relative">
                    <input type="text" id="prof-signature" 
                        maxlength="30" 
                        oninput="document.getElementById('sig-count').innerText = this.value.length + '/30'"
                        class="w-full px-5 py-3 bg-stone-50 border border-stone-200 rounded-xl text-sm outline-none focus:border-amber-400" 
                        placeholder="一句话介绍自己...">
                    <span id="sig-count" class="absolute right-4 top-3 text-[10px] text-stone-300 font-mono">0/30</span>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-bold text-stone-500 mb-2 uppercase">性别</label>
                    <select id="prof-gender" class="w-full px-4 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs"><option value="男">男</option><option value="女">女</option></select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-stone-500 mb-2 uppercase">年级</label>
                    <select id="prof-grade" class="w-full px-4 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs"></select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-stone-500 mb-2 uppercase">专业</label>
                    <select id="prof-major" class="w-full px-4 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs"></select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-stone-500 mb-2 uppercase">爱好 & 标签</label>
                <div id="prof-hobbies-container" class="mb-2"></div>
                <div id="prof-tags-container"></div>
            </div>

            <div class="flex gap-4 pt-4">
                <button type="button" onclick="toggleProfileEdit(false)" class="flex-1 py-3 bg-stone-100 text-stone-600 rounded-xl text-sm font-bold">取消</button>
                <button type="submit" class="flex-1 py-3 bg-stone-900 text-white rounded-xl text-sm font-bold shadow-lg shadow-stone-200">保存修改</button>
            </div>
        </form>
    </div>
</div>
