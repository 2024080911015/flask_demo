<div id="panel-profile" class="panel-content hidden p-6 max-w-3xl mx-auto space-y-6">
    <h2 class="text-2xl font-serif font-bold text-stone-800 mb-6">个人空间</h2>
    <div class="card-warm rounded-3xl p-8 shadow-sm border border-stone-100">
        <div class="flex flex-col items-center mb-10 pb-8 border-b border-stone-100">
            <div class="relative group cursor-pointer mb-4">
                <div class="w-28 h-28 rounded-full bg-gradient-to-br from-amber-100 to-orange-100 border-4 border-white flex items-center justify-center text-amber-700 font-bold text-5xl shadow-md transition-transform group-hover:scale-105" id="profileAvatar">?</div>
                <div class="absolute inset-0 bg-black/50 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                    <span class="text-white text-xs font-medium text-center">修改头像<br><span class="text-[10px] text-white/70">(敬请期待)</span></span>
                </div>
            </div>
            <h3 class="text-xl font-bold text-stone-800" id="prof-display-name">User</h3>
            <p class="text-stone-400 text-xs mt-1">系统专属 ID: <span id="profileUid" class="font-mono text-amber-600 bg-amber-50 px-2 py-0.5 rounded"></span></p>
        </div>

        <form id="profileForm" class="space-y-6" onsubmit="event.preventDefault(); saveProfile();">
            <div>
                <label class="block text-xs font-bold text-stone-500 mb-2 uppercase tracking-wider">用户名 (Username)</label>
                <input type="text" id="prof-username" class="w-full px-5 py-3 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-400/50 transition">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-bold text-stone-500 mb-2 uppercase tracking-wider">性别 (Gender)</label>
                    <select id="prof-gender" class="w-full px-5 py-3 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none"><option value="男">男</option><option value="女">女</option><option value="未知">未知</option></select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-stone-500 mb-2 uppercase tracking-wider">年级 (Grade)</label>
                    <select id="prof-grade" class="w-full px-5 py-3 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none" id="prof-grade-container"></select>
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-stone-500 mb-2 uppercase tracking-wider">专业 (Major)</label>
                <select id="prof-major" class="w-full px-5 py-3 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none" id="prof-major-container"></select>
            </div>
            <div>
                <label class="block text-xs font-bold text-stone-500 mb-2 uppercase tracking-wider">爱好 (Hobbies - 可多选)</label>
                <div id="prof-hobbies-container" class="flex flex-wrap gap-2 p-4 bg-stone-50 rounded-xl border border-stone-200"></div>
            </div>
            <div>
                <label class="block text-xs font-bold text-stone-500 mb-2 uppercase tracking-wider">专属标签 (Tags - 可多选)</label>
                <div id="prof-tags-container" class="flex flex-wrap gap-2 p-4 bg-stone-50 rounded-xl border border-stone-200"></div>
            </div>
            <div class="pt-6 mt-4 flex items-center justify-between">
                <p class="text-xs text-amber-600/70">ℹ️ 修改资料后，GNN 模型将在次日凌晨重训后生效。</p>
                <button type="submit" class="bg-stone-900 hover:bg-stone-800 text-white px-8 py-3 rounded-xl text-sm font-bold shadow-lg transition transform hover:-translate-y-0.5">保存修改</button>
            </div>
        </form>
    </div>
</div>
