<!-- START OF FILE panels/activity.html -->
<div id="panel-activity" class="panel-content hidden p-4 md:p-6 max-w-[1600px] mx-auto space-y-6">
    <!-- 顶部 Tab 导航 -->
    <div class="flex items-center justify-between mb-2">
        <div class="flex bg-stone-100 p-1 rounded-2xl gap-1">
            <button onclick="switchActivityTab('hall')" id="tab-act-hall" class="px-6 py-2.5 rounded-xl text-sm font-bold transition act-tab-active bg-white shadow-sm text-amber-700">🚀 组队大厅</button>
            <button onclick="switchActivityTab('create')" id="tab-act-create" class="px-6 py-2.5 rounded-xl text-sm font-bold transition text-stone-500 hover:bg-stone-200">➕ 发起项目</button>
            <button onclick="switchActivityTab('manage')" id="tab-act-manage" class="px-6 py-2.5 rounded-xl text-sm font-bold transition text-stone-500 hover:bg-stone-200 relative">
                📂 我的管理
                <span id="manage-badge" class="hidden absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-[10px] flex items-center justify-center rounded-full border-2 border-white">0</span>
            </button>
        </div>
    </div>

    <!-- 子页面 1：组队大厅列表 -->
    <div id="act-sub-hall" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
        <!-- 加载占位符 -->
        <div class="col-span-full py-20 text-center text-stone-300">正在通过 GNN 检索最适合你的项目...</div>
    </div>

    <!-- 子页面 2：发起项目表单 -->
    <div id="act-sub-create" class="hidden max-w-2xl mx-auto">
        <div class="card-warm p-8 rounded-[2rem] shadow-sm border border-stone-100">
            <h3 class="text-xl font-serif font-bold text-stone-800 mb-6">发布招募需求</h3>
            <form id="form-create-activity" class="space-y-5" onsubmit="handleCreateActivity(event)">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-stone-400 mb-2 uppercase">项目标题</label>
                        <input type="text" name="title" required class="w-full px-4 py-3 bg-stone-50 border border-stone-200 rounded-xl text-sm outline-none focus:border-amber-400">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-stone-400 mb-2 uppercase">活动性质</label>
                        <select name="nature" class="w-full px-4 py-3 bg-stone-50 border border-stone-200 rounded-xl text-sm outline-none">
                            <option value="学术竞赛">🏆 学术竞赛</option>
                            <option value="大创项目">💡 大创项目</option>
                            <option value="文体娱乐">🎸 文体娱乐</option>
                            <option value="社会实践">🌱 社会实践</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-stone-400 mb-2 uppercase">详细描述（需求、技能要求等）</label>
                    <textarea name="description" rows="4" required class="w-full px-4 py-3 bg-stone-50 border border-stone-200 rounded-xl text-sm outline-none focus:border-amber-400 resize-none"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-stone-400 mb-2 uppercase">目标人数</label>
                        <input type="number" name="total_capacity" value="5" class="w-full px-4 py-3 bg-stone-50 border border-stone-200 rounded-xl text-sm outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-stone-400 mb-2 uppercase">截止日期</label>
                        <input type="date" name="deadline" required class="w-full px-4 py-3 bg-stone-50 border border-stone-200 rounded-xl text-sm outline-none">
                    </div>
                </div>
                
                <!-- 好友邀请器 (Step 4 细化) -->
                <div>
                    <label class="block text-xs font-bold text-stone-400 mb-2 uppercase">邀请初始核心成员（已关注的好友）</label>
                    <div id="invite-friend-selector" class="p-4 bg-stone-50 rounded-xl border border-stone-200 max-h-40 overflow-y-auto space-y-2">
                        <!-- JS 填充好友列表 -->
                    </div>
                </div>

                <button type="submit" class="w-full py-4 bg-stone-900 text-white rounded-2xl font-bold shadow-xl hover:bg-amber-600 transition duration-300">
                    立即发布招募
                </button>
            </form>
        </div>
    </div>

    <!-- 子页面 3：我的管理 -->
    <div id="act-sub-manage" class="hidden space-y-8">
        <section>
            <h4 class="text-sm font-bold text-stone-400 uppercase mb-4 tracking-widest">我发起的项目</h4>
            <div id="manage-my-launched" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </section>
        <section>
            <h4 class="text-sm font-bold text-stone-400 uppercase mb-4 tracking-widest">我参与的项目</h4>
            <div id="manage-my-joined" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </section>
    </div>
</div>
